# Public-test caption inference with a synthetic-trained Qwen3.5-9B adapter.
stage: sft
do_predict: true
model_name_or_path: Qwen/Qwen3.5-9B
adapter_name_or_path: /path/to/synwts_outputs/runs/qwen35_9b_joint_phase_bbox_lora
eval_dataset: wts_public_test_caption
